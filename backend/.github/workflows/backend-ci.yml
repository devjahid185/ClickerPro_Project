name: Backend CI

# Runs the backend Jest + supertest smoke suite on every push and PR।
# Designed to work whether `backend/` is the git repo root OR a subfolder
# inside a monorepo (the workflow is self-contained — no parent paths used)।

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/schema.prisma'
      - 'tests/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/schema.prisma'
      - 'tests/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch: {}

# Cancel in-flight runs when a new commit lands on the same branch
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Cache npm — when package-lock.json exists this speeds runs up
          # significantly।  Prisma's postinstall is the slowest single step
          # so caching pays off।
          cache: npm

      - name: Install dependencies
        # `npm ci` if a lockfile exists, otherwise `npm install` — both
        # are deterministic enough for CI smoke; the lockfile path keeps
        # node_modules reproducible once the project commits one।
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
        env:
          # Prisma engine download keeps trying via TLS; CI sandbox is fine
          PRISMA_HIDE_UPDATE_MESSAGE: 'true'

      - name: Generate Prisma client
        # Tests use a mocked client, but `@prisma/client` still requires
        # the generated types to be present so that controllers can `require`
        # the module without throwing at test collection time।
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Run Jest suite
        run: npm test -- --ci --colors --reporters=default
        env:
          NODE_ENV: test
          # Tests sign their own JWTs with this secret; keep it stable
          JWT_SECRET: 'ci-only-secret-do-not-use-in-prod'

      - name: Run coverage gate
        # Threshold gates live in package.json's `jest.coverageThreshold`।
        # If coverage drops below the configured floors this step fails the
        # build, surfacing the regression on the PR before merge।
        run: npm run test:coverage -- --ci --colors --reporters=default
        env:
          NODE_ENV: test
          JWT_SECRET: 'ci-only-secret-do-not-use-in-prod'

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        # Only upload from the primary Node version so we don't double-count
        # the same lcov against two matrix legs.  CODECOV_TOKEN is required
        # for private repos; public repos can skip it (action falls back to
        # tokenless upload).  `fail_ci_if_error: false` keeps a Codecov
        # outage from blocking the build — the threshold gate above is the
        # authoritative quality bar; Codecov is just for diff comments.
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

