# Render.com one-click blueprint for the Clicker Pro API + Postgres.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. On Render: New → Blueprint → pick this repo. Render reads this file,
#      provisions a free Postgres DB, and wires DATABASE_URL automatically.
#   3. Set JWT_SECRET (a long random string) when prompted.
#
# The build runs `npm ci` (which triggers `prisma generate` via postinstall);
# the start command applies migrations then boots the server.
services:
  - type: web
    name: clicker-pro-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clicker-pro-db
          property: connectionString

databases:
  - name: clicker-pro-db
    plan: free
    region: singapore
