<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Graphy7 — photography studio management.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Graphy7">
  <link rel="apple-touch-icon" href="icons/Icon-192-v2.png?v=20260718">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20260718"/>

  <title>Graphy7</title>
  <link rel="manifest" href="manifest.json?v=20260718">

  <!--
    Suppress the browser's PWA "Install Graphy7 App" banner. Clients open the
    self-booking share link (app.<domain>/book/<token>) just to submit a
    request — the auto "Install app" prompt on top of the booking form was
    confusing them. The studio
    owner uses the real native APK, so nobody needs the PWA install path.
    Capturing beforeinstallprompt and never calling prompt() hides the banner.
  -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
    });
  </script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #160f0a;
    }

    #graphy7-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 70% 18%, rgba(255, 185, 96, 0.22), transparent 32%),
        linear-gradient(135deg, #160f0a 0%, #2b1d12 50%, #0f0a07 100%);
      color: #fff7ed;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #graphy7-boot-splash .boot-card {
      display: grid;
      gap: 18px;
      place-items: center;
      transform: translateY(-8px);
    }

    #graphy7-boot-splash .boot-mark {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(135deg, #f9a52e, #e2620e);
      box-shadow: 0 22px 70px rgba(226, 98, 14, 0.42);
      color: #1c1008;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 0;
    }

    #graphy7-boot-splash .boot-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0;
    }

    #graphy7-boot-splash .boot-loader {
      width: 132px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    #graphy7-boot-splash .boot-loader::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #f9a52e;
      animation: graphy7Boot 1.05s ease-in-out infinite;
    }

    body.flutter-loaded #graphy7-boot-splash {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes graphy7Boot {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="graphy7-boot-splash" aria-label="Loading Graphy7">
    <div class="boot-card">
      <div class="boot-mark">G7</div>
      <div class="boot-title">Graphy7</div>
      <div class="boot-loader" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    (function () {
      var done = false;
      function markLoaded() {
        if (done || !document.body) return;
        done = true;
        document.body.classList.add('flutter-loaded');
        window.setTimeout(function () {
          var splash = document.getElementById('graphy7-boot-splash');
          if (splash) splash.remove();
        }, 360);
      }
      window.addEventListener('flutter-first-frame', markLoaded);
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          window.setTimeout(markLoaded, 80);
          observer.disconnect();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
