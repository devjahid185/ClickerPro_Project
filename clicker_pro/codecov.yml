# codecov.yml — clicker_pro (Flutter)
#
# Mirrors `tool/check_coverage.dart --min=20` so PR diff comments
# reflect the same quality bar that the local gate enforces।  See
# https://docs.codecov.com/docs/codecovyml-reference।

coverage:
  precision: 2
  round: down
  range: "20...60"

  status:
    project:
      default:
        # Whole-project floor — `tool/check_coverage.dart` runs at 20%;
        # Codecov ratchets a tiny notch above to catch slow regressions
        # before they cross the local floor।
        target: 22%
        threshold: 1%
        if_ci_failed: error
        only_pulls: false
    patch:
      default:
        # New code in the diff must reach 50%।  This is the cheapest
        # nudge to keep new feature slices habitually-tested without
        # blocking unrelated UI tweaks।
        target: 50%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

flags:
  flutter:
    paths:
      - lib/

# Excluded by `tool/check_coverage.dart` already, but Codecov has its
# own ingest path so we list them here too।
ignore:
  - "test/**"
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*.mocks.dart"
  - "**/generated/**"
  - "lib/l10n/app_localizations*.dart"
