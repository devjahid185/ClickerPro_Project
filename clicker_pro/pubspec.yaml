name: clicker_pro
description: "Clicker Pro — photography & event management. Deep Ocean theme. Offline-first. Bilingual."
publish_to: 'none'
version: 3.8.0+38

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^2.5.1
  google_fonts: ^8.1.0
  intl: ^0.20.2
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  connectivity_plus: ^6.0.0
  flutter_markdown: ^0.7.4
  url_launcher: ^6.3.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1
  share_plus: ^13.1.0
  uuid: ^4.5.1
  pdf: ^3.11.0
  printing: ^5.13.0
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  sign_in_with_apple: ^6.1.4
  # Firebase: core + messaging only — auth/database/storage were unused
  # and added ~15MB of dead weight to the APK.
  firebase_core: ^3.1.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  glados: ^1.1.7
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon_ios.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A0E08"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/brand/