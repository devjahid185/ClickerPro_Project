name: Flutter CI

# Runs `flutter analyze` + `flutter test` on every push and PR।
# Uses the Flutter version channel pinned to "stable" — bump when the
# project's `pubspec.yaml` SDK constraint changes।

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - 'assets/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - 'assets/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch: {}

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        # `flutter test` itself doesn't need JDK, but `flutter pub get`
        # may resolve plugins that hit gradle on first run।  Pinning the
        # JDK now keeps future apk-build jobs cheap to add।
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version (diagnostic)
        run: flutter --version

      - name: Pub get
        # Strict — fail fast on resolution errors so CI is loud about
        # accidental breaking dependency upgrades।
        run: flutter pub get

      - name: Generate l10n
        # gen-l10n is part of `flutter pub get` since 3.10, কিন্তু
        # explicit step output debug করতে সাহায্য করে যদি কখনো ARB
        # mismatch হয়।
        run: flutter gen-l10n
        continue-on-error: true

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test (with coverage)
        # `--no-pub` because we already ran pub get, এবং `-r expanded`
        # CI log readable রাখে।  Coverage ফাইল `coverage/lcov.info` এ
        # লেখা হবে; পরের step এটাকে threshold gate করে।
        run: flutter test --no-pub --coverage -r expanded

      - name: Coverage gate
        # tool/check_coverage.dart auto-excludes generated (*.g.dart,
        # *.freezed.dart, *.mocks.dart) files।  --min কে এখন project এর
        # current floor এর কাছাকাছি রাখা হয়েছে — coverage বাড়ার সাথে
        # সাথে এটা bump করুন।
        run: dart run tool/check_coverage.dart --min=20

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        # Public repos can skip CODECOV_TOKEN (tokenless upload); private
        # repos must set the secret.  Soft-fail on Codecov outages so the
        # build's authoritative quality bar stays the local threshold gate.
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: flutter
          name: flutter-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Optional release APK artifact ────────────────────────────────
  #
  # Only triggers on git tags matching `v*` (e.g., `v1.0.0`) OR via
  # manual `workflow_dispatch`।  Keeps every PR build fast — APK build
  # is ~2-3× slower than the test job।
  #
  # Required secrets (set in repo Settings → Secrets and variables →
  # Actions):
  #   ANDROID_KEYSTORE_BASE64  — base64-encoded clicker_pro.jks
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  #
  # When secrets are missing the job still runs but builds an
  # unsigned-by-debug-key APK (so contributors can manually trigger
  # the workflow on a fork without full keystore setup)।
  release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore (when secret set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $HOME/keystores/clicker_pro.jks
          echo "Keystore decoded to $HOME/keystores/clicker_pro.jks"

      - name: Write key.properties (when secret set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=$HOME/keystores/clicker_pro.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (for Play Store)
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
